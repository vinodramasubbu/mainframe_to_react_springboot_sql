services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU18-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SURVDEMO_DB_PASSWORD:?Set SURVDEMO_DB_PASSWORD in database/local/.env}
    ports:
      - "127.0.0.1:${SURVDEMO_DB_PORT:-1433}:1433"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b >/dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - survdemo-sql-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  survdemo-sql-data: