spring:
  application:
    name: survdemo-backend
  datasource:
    url: ${SURVDEMO_DB_URL}
    username: ${SURVDEMO_DB_USERNAME:}
    password: ${SURVDEMO_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SURVDEMO_JWT_ISSUER_URI}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

server:
  error:
    include-message: never

survdemo:
  security:
    allowed-origin: ${SURVDEMO_ALLOWED_ORIGIN:https://localhost:5173}