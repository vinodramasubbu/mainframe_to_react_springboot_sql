openapi: 3.1.0
info:
  title: SURVDEMO API
  version: 1.0.0
  description: API contract for survivor entitlement inquiry and on-demand monthly benefit runs.
servers:
  - url: /api/v1
paths:
  /monthly-benefit-runs:
    post:
      operationId: runMonthlyBenefits
      summary: Run the monthly survivor benefit calculation on demand
      description: Executes the authoritative monthly calculation synchronously and returns its outcome and staged results.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonthlyBenefitRunRequest"
      responses:
        "200":
          description: Run completed with clean, business-exception, or technical-failure outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyBenefitRun"
        "400":
          $ref: "#/components/responses/BatchValidationProblem"
        "401":
          $ref: "#/components/responses/AuthenticationProblem"
        "403":
          $ref: "#/components/responses/BatchAuthorizationProblem"
        "503":
          $ref: "#/components/responses/UnavailableProblem"
        "500":
          $ref: "#/components/responses/UnexpectedProblem"
  /survivor-entitlements/{claimId}/beneficiaries/{beneficiaryId}:
    get:
      operationId: inquireSurvivorEntitlement
      summary: Inquire about one survivor entitlement
      description: Replaces CICS transaction SI01 without exposing terminal or database structures.
      security:
        - bearerAuth: []
      parameters:
        - name: claimId
          in: path
          required: true
          description: Fixed-width legacy claim identifier without padding.
          schema:
            type: string
            minLength: 1
            maxLength: 12
            pattern: ^[^\s].*[^\s]$|^[^\s]$
        - name: beneficiaryId
          in: path
          required: true
          description: Fixed-width legacy beneficiary identifier without padding.
          schema:
            type: string
            minLength: 1
            maxLength: 10
            pattern: ^[^\s].*[^\s]$|^[^\s]$
      responses:
        "200":
          description: Entitlement found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurvivorEntitlement"
        "400":
          $ref: "#/components/responses/ValidationProblem"
        "401":
          $ref: "#/components/responses/AuthenticationProblem"
        "403":
          $ref: "#/components/responses/AuthorizationProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "503":
          $ref: "#/components/responses/UnavailableProblem"
        "500":
          $ref: "#/components/responses/UnexpectedProblem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    MonthlyBenefitRunRequest:
      type: object
      additionalProperties: false
      required: [runId, calculationDate]
      properties:
        runId:
          type: string
          minLength: 12
          maxLength: 12
          pattern: ^\S{12}$
          description: Unique fixed-width run identifier. A failed run must be retried with a new identifier.
        calculationDate:
          type: string
          format: date
    MonthlyBenefitRun:
      type: object
      additionalProperties: false
      required:
        - runId
        - calculationDate
        - benefitMonth
        - returnCode
        - outcome
        - paymentCount
        - paymentTotal
        - exceptionCount
        - payments
        - exceptions
      properties:
        runId:
          type: string
        calculationDate:
          type: string
          format: date
        benefitMonth:
          type: string
          format: date
        returnCode:
          type: integer
          enum: [0, 4, 12]
        outcome:
          type: string
          enum: [CLEAN, COMPLETED_WITH_EXCEPTIONS, TECHNICAL_FAILURE]
        paymentCount:
          type: integer
          minimum: 0
        paymentTotal:
          type: string
          description: Exact scale-two decimal amount.
          pattern: ^-?\d+\.\d{2}$
        exceptionCount:
          type: integer
          minimum: 0
        payments:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyBenefitPayment"
        exceptions:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyBenefitException"
    MonthlyBenefitPayment:
      type: object
      additionalProperties: false
      required:
        - paymentId
        - claimId
        - beneficiaryId
        - beneficiaryName
        - relationshipCode
        - benefitMonth
        - grossAmount
        - offsetAmount
        - netAmount
        - status
      properties:
        paymentId:
          type: string
        claimId:
          type: string
        beneficiaryId:
          type: string
        beneficiaryName:
          type: string
        relationshipCode:
          type: string
        benefitMonth:
          type: string
          format: date
        grossAmount:
          type: string
          pattern: ^-?\d+\.\d{2}$
        offsetAmount:
          type: string
          pattern: ^-?\d+\.\d{2}$
        netAmount:
          type: string
          pattern: ^-?\d+\.\d{2}$
        status:
          type: string
    MonthlyBenefitException:
      type: object
      additionalProperties: false
      required: [claimId, beneficiaryId, reasonCode, grossAmount, netAmount]
      properties:
        claimId:
          type: string
        beneficiaryId:
          type: string
        reasonCode:
          type: string
        grossAmount:
          type: string
          pattern: ^-?\d+\.\d{2}$
        netAmount:
          type: string
          pattern: ^-?\d+\.\d{2}$
    SurvivorEntitlement:
      type: object
      additionalProperties: false
      required:
        - claimId
        - beneficiaryId
        - beneficiaryName
        - relationshipCode
        - relationshipLabel
        - monthlyAmount
        - startDate
        - displayStatus
        - message
      properties:
        claimId:
          type: string
          maxLength: 12
        beneficiaryId:
          type: string
          maxLength: 10
        beneficiaryName:
          type: string
          maxLength: 60
        relationshipCode:
          type: string
          maxLength: 3
        relationshipLabel:
          type: string
          enum: [SPOUSE, CHILD, DEPENDENT, UNKNOWN]
        monthlyAmount:
          type: string
          description: Exact scale-two decimal amount. Consumers must not parse it as binary floating point.
          pattern: ^-?\d+\.\d{2}$
          examples: ["1250.00"]
        startDate:
          type: string
          format: date
        endDate:
          type: [string, "null"]
          format: date
        displayStatus:
          type: string
          enum: [NOT_APPROVED, INELIGIBLE, ACTIVE, SUSPENDED, ENDED, CANCELLED, UNKNOWN]
        message:
          type: string
          enum:
            - CLAIM IS NOT APPROVED
            - BENEFICIARY IS NOT ELIGIBLE
            - ENTITLEMENT FOUND
            - ENTITLEMENT IS SUSPENDED
            - ENTITLEMENT HAS ENDED
            - ENTITLEMENT IS CANCELLED
            - UNKNOWN ENTITLEMENT STATUS
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlationId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          type: string
          enum:
            - SURV-VALIDATION
            - SURV-AUTHENTICATION-REQUIRED
            - SURV-FORBIDDEN
            - SURV-ENTITLEMENT-NOT-FOUND
            - SURV-BATCH-VALIDATION
            - SURV-SERVICE-UNAVAILABLE
            - SURV-UNEXPECTED
        correlationId:
          type: string
  responses:
    BatchValidationProblem:
      description: Monthly run syntax is invalid
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationProblem:
      description: Identifier syntax is invalid
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    AuthenticationProblem:
      description: Authentication is required
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    AuthorizationProblem:
      description: The authenticated actor cannot perform survivor inquiry
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFoundProblem:
      description: No entitlement exists for the supplied identifiers
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnavailableProblem:
      description: The inquiry service cannot complete the request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnexpectedProblem:
      description: An unexpected error prevented the request from completing
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BatchAuthorizationProblem:
      description: The authenticated actor cannot run monthly survivor benefits
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"